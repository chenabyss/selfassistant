name: life_app
description: 个人生活信息系统 V1 —— 本地优先的生活记录与行动管理应用（Windows + Android）。
publish_to: none

# 版本约束的唯一权威来源是 ../tool/versions.yaml。
# 下方 environment 的区间必须与其一致（tool/check_versions.mjs 会断言并纳入 CI）。
#
# 下限依据：
#   Dart   >=3.10.0  —— package:sqlite3 3.7.0 的要求
#   Flutter >=3.38.1 —— 3.38 才有 stable 的 build hooks / code assets
#                       （package:sqlite3 3.x 依赖它）；3.38.1 同时是
#                       flutter_local_notifications 22.3.2 的 pubspec 下限。
#                       使用托盘（tray_manager）需 >=3.47；当前未引入该依赖。
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

# 依赖按字母序排列：analysis_options.yaml 启用了 sort_pub_dependencies，
# 而 `flutter analyze` 对任何 issue 都以退出码 1 结束。因此这里不按用途分组，
# 也不要插入分节注释 —— 分组会破坏字母序并让 CI 失败。
#
# 依赖选择说明（详见 docs/dart-verification.md 与 docs/decisions/0002）：
#   * 原生 SQLite 由 package:sqlite3 3.x 的 build hooks 打包（内含 SQLite 3.53.4，含 FTS5）。
#   * 明确禁止的三个依赖见 ../tool/versions.yaml 的 forbidden 段，
#     并由 CI 的"版本与依赖树检查"步骤断言：
#       - sqlite3_flutter_libs   （已 EOL，0.6.0+eol 移除了全部代码）
#       - sqlcipher_flutter_libs （同上）
#       - drift_flutter          （依赖链仍指向上述两个 EOL 包）
#   * 瞬时时间存 UTC 毫秒 + IANA tz_id；本地日期存 YYYY-MM-DD。
#   * 通知按"尽力而为"建模（见 docs/decisions/0006）：状态落库、能力查询、启动补课。
dependencies:
  archive: ^4.5.1
  crypto: ^3.0.7
  drift: ^2.35.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  uses-material-design: true
