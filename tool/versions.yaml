# 版本约束 —— 唯一权威来源
#
# 为什么单独一个文件：Flutter/Dart/pub 的版本下限不是"随便选的"，
# 每一条都有具体原因（见每行注释与 docs/dart-verification.md）。
# 把原因和数值放在一起，避免将来有人"顺手升/降"而破坏某个隐藏依赖。
#
# 校验：`dart run tool/check_versions.dart`（阶段 0 起纳入 CI）

flutter:
  # 3.38 才有 stable 的 build hooks / code assets，而 package:sqlite3 3.x 依赖它。
  # 3.38.1 是 flutter_local_notifications 22.3.2 的 pubspec 下限。
  # 3.47 是 tray_manager 0.8.0 的下限；tray 仅在需要托盘常驻时使用。
  pinned: "3.47.0"
  minimum: "3.38.1"

dart:
  # 与 Flutter 3.47 配套的 Dart SDK 下限；由 package:sqlite3 3.7.0 要求。
  minimum: ">=3.10.0 <4.0.0"

sqlite:
  # package:sqlite3 3.7.0 打包的 SQLite 版本（见其 CHANGELOG：3.5.1 → 3.53.4）。
  # 必须 >= 3.51.3：WAL-reset 缺陷影响 3.7.0–3.51.2，触发条件是
  # >=2 个连接同时写入/检查点 —— 正是本项目（写 isolate + 读池 + 后台任务）的形态。
  version: "3.53.4"
  minimum_acceptable: "3.51.3"
  # 编译选项必须包含（由 package:sqlite3 预编译二进制提供）
  required_compile_options:
    - SQLITE_ENABLE_FTS5
    - SQLITE_ENABLE_JSON1

android:
  # 候选默认值（问题 Q7）；用户设备确定后更新。
  min_sdk: 29          # Android 10
  compile_sdk: 35
  target_sdk: 35
  # Google Play 要求 64 位设备上未压缩共享库按 16 KB 对齐。
  required_page_alignment_kb: 16

packages:
  # 名称: [锁定版本, 为什么是这个下限]
  drift: ["2.35.2", "当前稳定；>=2.32 起无需 sqlite3_flutter_libs"]
  sqlite3: ["3.7.0", "通过 build hooks 打包 SQLite 3.53.4（含 FTS5）"]
  flutter_local_notifications: ["22.3.2", "要求 Flutter >=3.38.1；Windows 支持 C++/WinRT Toast"]
  timezone: ["0.11.1", "TZDateTime 与 IANA 时区库"]
  flutter_timezone: ["5.1.1", "读取设备 IANA 时区；两端均支持"]
  file_selector: ["1.1.0", "Flutter 桌面端官方推荐的文件选择插件"]
  path_provider: ["2.1.6", "应用私有目录；两端均支持"]
  archive: ["4.5.1", "ZIP 备份归档"]
  crypto: ["3.0.7", "sha256（内容寻址与备份清单）"]
  flutter_secure_storage: ["11.2.0", "设备 token 与（可选）密钥存储"]
  windows_single_instance: ["1.2.0", "桌面单实例；多实例并发写同一 SQLite 文件会出错"]

forbidden:
  # 明确禁止的依赖：出现即 CI 失败
  sqlite3_flutter_libs: "已 EOL，0.6.0+eol 移除了全部代码；替代品是 package:sqlite3 ^3.0.0"
  sqlcipher_flutter_libs: "已 EOL，同上"
  drift_flutter: "依赖链仍指向上述两个 EOL 包（改用 NativeDatabase.createInBackground）"
